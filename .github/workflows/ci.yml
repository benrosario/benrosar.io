name: Portfolio CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # CI always builds the public walkthrough. Never use live AI credentials.
      SIERRA_API_URL: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build and TypeScript checks
        run: npm run build
      - name: Production page and API tests
        run: npm run test:integration
      - name: vinext compatibility
        run: npm run check:vinext
      - name: Cloudflare production build
        run: npm run build:vinext
      - name: Cloudflare page and API tests with separate cache Worker
        run: npm run test:integration:vinext
